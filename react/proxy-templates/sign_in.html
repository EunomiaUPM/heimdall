<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eunomia Heimdall Admin - Sign in</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: #09091B;
      --foreground: #f8f8fa;
      --brand-orange: #ecba94;
      --primary-700: #964c2a;
      --primary-600: #ad5a32;
      --primary-500: #c47044;
      --radius: 0.5rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Source Sans 3', system-ui, sans-serif;
      background-color: var(--background);
      color: var(--foreground);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .bg-glow {
      position: fixed;
      width: 640px;
      height: 640px;
      background: radial-gradient(circle, var(--primary-500) 0%, transparent 70%);
      opacity: 0.08;
      top: -220px;
      left: -220px;
      border-radius: 50%;
      pointer-events: none;
    }

    .bg-glow-2 {
      position: fixed;
      width: 640px;
      height: 640px;
      background: radial-gradient(circle, var(--brand-orange) 0%, transparent 70%);
      opacity: 0.06;
      bottom: -220px;
      right: -220px;
      border-radius: 50%;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      padding: 2rem;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0.75rem;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(12px);
      text-align: left;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
    }

    .brand-tag {
      font-family: monospace;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--brand-orange);
      margin-bottom: 0.75rem;
    }

    h1 {
      font-family: 'Ubuntu', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: var(--foreground);
    }

    p {
      color: rgba(241, 241, 246, 0.65);
      font-size: 0.875rem;
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.65rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #ffffff;
      background-color: var(--primary-700);
      border: 1px solid rgba(196, 112, 68, 0.35);
      border-radius: var(--radius);
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s, border-color 0.15s, transform 0.1s;
    }

    .btn:hover {
      background-color: var(--primary-600);
      border-color: rgba(236, 186, 148, 0.5);
    }

    .btn:active {
      transform: scale(0.98);
    }

    footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>

  <div class="container">
    <div class="card">
      <div class="brand-tag">Eunomia • Heimdall</div>
      <h1>Eunomia Heimdall Admin</h1>
      <p>Your session has ended or has not started. Sign in to access the console.</p>

      <form method="GET" action="{{.ProxyPrefix}}/start">
        <input type="hidden" name="rd" value="{{.Redirect}}">
        <button type="submit" class="btn">Sign in</button>
      </form>
    </div>

    <footer>
      GNAP GateKeeper • OID4VCI Issuer • OID4VP Verifier
    </footer>
  </div>

  <script>
    if (window.location.hash) {
      (function() {
        var inputs = document.getElementsByName('rd');
        for (var i = 0; i < inputs.length; i++) {
          var idx = inputs[i].value.indexOf('#');
          if (idx >= 0) {
            inputs[i].value = inputs[i].value.substr(0, idx);
          }
          inputs[i].value += window.location.hash;
        }
      })();
    }
  </script>
</body>
</html>
