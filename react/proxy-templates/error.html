<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eunomia Heimdall Admin - Error</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: #09091B;
      --foreground: #f8f8fa;
      --brand-orange: #fda658;
      --primary-500: #f97316;
      --radius: 0.75rem;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Source Sans 3', system-ui, sans-serif;
      background-color: var(--background);
      color: var(--foreground);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .bg-glow {
      position: fixed; width: 640px; height: 640px;
      background: radial-gradient(circle, var(--primary-500) 0%, transparent 70%);
      opacity: 0.08; top: -220px; left: -220px;
      border-radius: 50%; pointer-events: none;
    }

    .bg-glow-2 {
      position: fixed; width: 640px; height: 640px;
      background: radial-gradient(circle, var(--brand-orange) 0%, transparent 70%);
      opacity: 0.06; bottom: -220px; right: -220px;
      border-radius: 50%; pointer-events: none;
    }

    .container {
      position: relative; z-index: 10;
      width: 100%; max-width: 400px; padding: 2rem;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      backdrop-filter: blur(12px);
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
    }

    .brand-tag {
      font-family: monospace;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--brand-orange);
      margin-bottom: 1rem;
    }

    h1 {
      font-family: 'Ubuntu', sans-serif;
      font-size: 1.25rem; font-weight: 600;
      margin-bottom: 0.5rem; color: #f47883;
    }

    p {
      color: rgba(241, 241, 246, 0.65);
      font-size: 0.875rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>

  <div class="container">
    <div class="card">
      <div class="brand-tag">Eunomia • Heimdall</div>
      <h1>Authentication Error</h1>
      <p>{{.Message}}</p>
    </div>
  </div>
</body>
</html>
