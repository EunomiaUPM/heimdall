name: mini-heimdall

services:
  heimdall-db:
    container_name: heimdall-db
    image: postgres
    restart: always
    env_file:
      - ./static/environment/envs/db.env.example
    ports:
      - "1450:5432"

  heimdall-setup:
    container_name: heimdall-setup
    image: rmenendez8/heimdall:v2.0.3
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    volumes:
      - ./static:/app/static
      - ./vault:/app/vault
    depends_on:
      - heimdall-db
    env_file:
      - ./static/environment/envs/heimdall.env.example
    environment:
      RUST_BACKTRACE: 1
    command:
      - setup
      - --env-file
      - /app/static/environment/config/mini_basic_dataspace_authority.yaml
    restart: "no"

  heimdall:
    container_name: heimdall
    image: rmenendez8/heimdall:v2.0.3
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    ports:
      - "1500:1500"
    volumes:
      - ./static:/app/static
      - ./vault:/app/vault
    depends_on:
      heimdall-setup:
        condition: service_completed_successfully
    env_file:
      - ./static/environment/envs/heimdall.env.example
    environment:
      RUST_BACKTRACE: 1
    command:
      - start
      - --env-file
      - /app/static/environment/config/mini_basic_dataspace_authority.yaml