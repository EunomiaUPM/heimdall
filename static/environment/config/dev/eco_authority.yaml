# ==========================
# COMMON ANCHORS
# ==========================
http_host: &http_host
  protocol: 'http'
  url: '127.0.0.1'
  port: '1500'
  internal_port: null

# ==========================
# CONFIG
# ==========================

hosts_config:
  http: *http_host
  grpc: null
  graphql: null

connection_config:
  is_local: true
  is_prod: false
  is_vault_real: false
  has_tls_proxy: false

db_config:
  db_type: Postgres
  url: '127.0.0.1'
  port: '1450'

wallet_config:
  api:
    protocol: 'http'
    url: '127.0.0.1'
    port: '7001'
  id: null

did_config:
  did: 'did:jwk:ey...'
  type: Jwk
  did_web_options: null
  #    domain: "CHANGE_ME"
  #    path: null

role: EcoAuthority

api_config:
  version: 'v1'
  openapi_path: './static/specs/openapi/openapi.json'

vc_config:
  vc_model: JwtVc
  w3c_data_model: V2

issue_config:
  ds_config:
    dataspace_id: 'RainbowDataspace'
  clh_config:
    label_level: 'SC'
    engine_version: '2.11.0'
    rules_version: 'CD25.10'
    validated_criteria: 'https://docs.gaia-x.eu/policy-rules-committee/compliance-document/25.10/criteria_participant/#PA1.1'


verify_req_config:
  is_cert_allowed: true
  vcs_requested: [ 'gx:VatId','gx:LegalPerson','gx:TermsAndConditions' ]

is_react: true
